<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>move preview</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    canvas {
      display: block;
    }

    #panel {
      position: fixed;
      left: 16px;
      top: 16px;
      max-width: calc(100vw - 32px);
      padding: 12px 16px;
      border: 1px solid #d8d8d8;
      border-radius: 10px;
      background-color: #ffffff;
      font-size: 15px;
      color: #333333;
    }

    #label {
      margin: 0 0 10px;
      font-weight: 600;
    }

    #moves {
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      list-style: none;
    }

    #inputs {
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
    }

    #inputs li {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #inputs output {
      min-width: 36px;
      text-align: right;
    }

    #replay {
      margin-top: 10px;
      padding: 6px 14px;
      border: 1px solid #d8d8d8;
      border-radius: 8px;
      background-color: #fafafa;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="stage"></div>
  <div id="panel">
    <p id="label"></p>
    <ul id="moves"></ul>
    <ul id="inputs"></ul>
    <button id="replay" type="button" hidden>もう一度</button>
  </div>
  <script type="module" src="./move.ts"></script>
</body>

</html>
