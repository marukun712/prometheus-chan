<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>prometheus-chan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&display=swap" rel="stylesheet">
  <style>
    :root {
      --edge: 20px;
      --actions-height: 62px;
      --panel-border: #f0c4d2;
      --panel-bg: #fffafb;
      --panel-shadow: 0 6px 20px rgba(190, 140, 160, 0.25);
      --panel-text: #5a4a51;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: "Zen Maru Gothic", sans-serif;
    }

    canvas {
      display: block;
    }

    #state {
      position: fixed;
      left: var(--edge);
      top: var(--edge);
      max-width: calc(100vw - var(--edge) * 2);
      display: flex;
      flex-wrap: wrap;
      gap: 12px 26px;
      font-size: clamp(18px, 2.2vw, 26px);
      line-height: 1.5;
      text-shadow: 0 0 6px #ffffff, 0 0 12px #ffffff;
    }

    #state button {
      padding: 0;
      border: none;
      background: none;
      font: inherit;
      color: inherit;
      white-space: pre-line;
      text-align: center;
      cursor: pointer;
    }

    #actions {
      position: fixed;
      left: var(--edge);
      bottom: var(--edge);
      display: flex;
      gap: 10px;
    }

    #actions button {
      padding: 13px 24px;
      border: 2px solid var(--panel-border);
      border-radius: 14px;
      background-color: var(--panel-bg);
      box-shadow: var(--panel-shadow);
      font-family: inherit;
      font-size: 17px;
      color: var(--panel-text);
      cursor: pointer;
    }

    #care {
      position: fixed;
      z-index: 1;
      left: var(--edge);
      bottom: calc(var(--edge) + var(--actions-height));
      width: min(380px, calc(100vw - var(--edge) * 2));
      max-height: 44vh;
      overflow-y: auto;
      box-sizing: border-box;
      margin: 0;
      padding: 16px 18px 16px 36px;
      border: 2px solid var(--panel-border);
      border-radius: 18px;
      background-color: var(--panel-bg);
      box-shadow: var(--panel-shadow);
      font-size: 17px;
      line-height: 1.7;
      color: var(--panel-text);
    }

    #chat {
      position: fixed;
      right: var(--edge);
      bottom: var(--edge);
      width: min(400px, calc(100vw - var(--edge) * 2));
      max-height: 46vh;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      padding: 16px;
      border: 2px solid var(--panel-border);
      border-radius: 18px;
      background-color: var(--panel-bg);
      box-shadow: var(--panel-shadow);
      color: var(--panel-text);
    }

    #chat-title {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #c9798f;
    }

    #chat-log {
      margin: 0;
      padding: 0;
      list-style: none;
      overflow-y: auto;
    }

    #chat-log li {
      padding: 11px 15px;
      border: 1px solid #f6dde4;
      border-radius: 14px 14px 14px 4px;
      background-color: #ffffff;
      font-size: 17px;
      line-height: 1.7;
    }

    #care li+li,
    #chat-log li+li {
      margin-top: 10px;
    }

    #chat-log time {
      display: block;
      margin-top: 5px;
      font-size: 13px;
      color: #bda0aa;
    }

    @media (max-width: 760px) {
      :root {
        --edge: 14px;
      }

      #state {
        gap: 10px 20px;
      }

      #care,
      #chat {
        left: var(--edge);
        right: var(--edge);
        width: auto;
      }

      #chat {
        bottom: calc(var(--edge) + var(--actions-height));
        max-height: 34vh;
      }

      #care {
        max-height: 40vh;
      }
    }
  </style>
</head>

<body>
  <div id="stage"></div>
  <div id="state"></div>
  <ul id="care" hidden></ul>
  <div id="actions">
    <button id="care-toggle" type="button">おせわ</button>
  </div>
  <div id="chat">
    <p id="chat-title">メッセージ</p>
    <ul id="chat-log"></ul>
  </div>
  <script type="module" src="./main.ts"></script>
</body>

</html>
