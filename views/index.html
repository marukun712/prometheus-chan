<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>prometheus-chan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&display=swap" rel="stylesheet">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: "Zen Maru Gothic", sans-serif;
    }

    canvas {
      display: block;
    }

    #state {
      position: fixed;
      left: 20px;
      top: 20px;
      display: flex;
      gap: 18px;
      font-size: 20px;
      line-height: 1.5;
      text-shadow: 0 0 4px #ffffff;
    }

    #state button {
      padding: 0;
      border: none;
      background: none;
      font: inherit;
      color: inherit;
      white-space: pre-line;
      text-align: center;
      cursor: pointer;
    }

    #actions {
      position: fixed;
      left: 20px;
      bottom: 20px;
      display: flex;
      gap: 10px;
    }

    #actions button {
      padding: 10px 18px;
      border: 2px solid #f0c4d2;
      border-radius: 14px;
      background-color: #fffafb;
      box-shadow: 0 6px 20px rgba(190, 140, 160, 0.25);
      font-family: inherit;
      font-size: 14px;
      color: #5a4a51;
      cursor: pointer;
    }

    #chat {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 320px;
      max-height: 50vh;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      padding: 14px;
      border: 2px solid #f0c4d2;
      border-radius: 18px;
      background-color: #fffafb;
      box-shadow: 0 6px 20px rgba(190, 140, 160, 0.25);
      color: #5a4a51;
    }

    #chat-title {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #c9798f;
    }

    #chat-log {
      margin: 0;
      padding: 0;
      list-style: none;
      overflow-y: auto;
    }

    #chat-log li {
      padding: 9px 13px;
      border: 1px solid #f6dde4;
      border-radius: 14px 14px 14px 4px;
      background-color: #ffffff;
      font-size: 14px;
      line-height: 1.6;
    }

    #chat-log li+li {
      margin-top: 8px;
    }

    #chat-log time {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      color: #bda0aa;
    }

    #care {
      position: fixed;
      left: 20px;
      bottom: 76px;
      width: 300px;
      box-sizing: border-box;
      margin: 0;
      padding: 14px 14px 14px 32px;
      border: 2px solid #f0c4d2;
      border-radius: 18px;
      background-color: #fffafb;
      box-shadow: 0 6px 20px rgba(190, 140, 160, 0.25);
      font-size: 14px;
      line-height: 1.6;
      color: #5a4a51;
    }

    #care li+li {
      margin-top: 6px;
    }
  </style>
</head>

<body>
  <div id="stage"></div>
  <div id="state"></div>
  <ul id="care" hidden></ul>
  <div id="actions">
    <button id="care-toggle" type="button">おせわ</button>
  </div>
  <div id="chat">
    <p id="chat-title">メッセージ</p>
    <ul id="chat-log"></ul>
  </div>
  <script type="module" src="./main.ts"></script>
</body>

</html>
